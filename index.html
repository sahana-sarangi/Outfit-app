<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wishlist & Outfit Modeler</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #111111;
            --border-color: #000000;
            --subtle-gray: #f2f2f2;
            --mid-gray: #767676;
            --dark-gray: #333333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            border-radius: 0 !important; /* Force pure sharp corners everywhere */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Top Navigation */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 32px;
            border-bottom: 1px solid var(--border-color);
            background: #fff;
        }

        .user-title {
            font-size: 20px;
            font-weight: 500;
            letter-spacing: -0.02em;
        }

        .nav-tabs {
            display: flex;
            gap: 24px;
        }

        .nav-btn {
            background: none;
            border: none;
            font-size: 15px;
            cursor: pointer;
            padding: 4px 0;
            color: var(--mid-gray);
            border-bottom: 2px solid transparent !important;
            font-weight: 500;
        }

        .nav-btn.active {
            color: var(--text-color);
            border-bottom: 2px solid var(--border-color) !important;
        }

        /* Controls Bar */
        .controls-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 32px;
            border-bottom: 1px solid var(--subtle-gray);
            gap: 16px;
            flex-wrap: wrap;
        }

        .filters-group {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        select, input[type="text"], input[type="number"] {
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            font-size: 13px;
            background: #fff;
            outline: none;
        }

        select:focus, input:focus {
            border-color: #000;
        }

        /* Main Layout */
        main {
            flex: 1;
            padding: 32px;
            position: relative;
        }

        /* Grid Display */
        .wishlist-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }

        /* Card Styles */
        .card {
            border: 1px solid var(--border-color);
            background: #fff;
            position: relative;
            display: flex;
            flex-direction: column;
            aspect-ratio: 1 / 1.25;
            cursor: pointer;
            user-select: none;
        }

        .card-add-trigger {
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px dashed var(--border-color);
            font-size: 32px;
            color: var(--border-color);
            background: #fafafa;
        }

        .card-add-trigger:hover {
            background: #f0f0f0;
        }

        .card-img-container {
            width: 100%;
            height: 72%;
            background: var(--subtle-gray);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .card-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-details {
            padding: 10px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            flex: 1;
            background: #fff;
            border-top: 1px solid var(--subtle-gray);
        }

        .card-title {
            font-size: 12px;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-price {
            font-size: 12px;
            color: var(--dark-gray);
            font-weight: 600;
            margin-top: 4px;
        }

        .card-badge {
            position: absolute;
            top: 8px;
            left: 8px;
            background: #000;
            color: #fff;
            font-size: 9px;
            padding: 3px 6px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .trash-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(255,255,255,0.9);
            border: 1px solid var(--border-color);
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 12px;
            z-index: 2;
        }

        .trash-btn:hover {
            background: #000;
            color: #fff;
        }

        /* Side Drawers */
        .drawer-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.2);
            z-index: 100;
            display: none;
        }

        .drawer-overlay.open {
            display: block;
        }

        .drawer {
            position: fixed;
            top: 0;
            right: -480px;
            width: 440px;
            height: 100%;
            background: #fff;
            border-left: 1px solid var(--border-color);
            z-index: 101;
            transition: right 0.25s ease-in-out;
            display: flex;
            flex-direction: column;
            padding: 24px;
            overflow-y: auto;
        }

        .drawer.open {
            right: 0;
        }

        .drawer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 16px;
            margin-bottom: 24px;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .form-group input, .form-group textarea {
            width: 100%;
            border: 1px solid var(--border-color);
            padding: 10px;
            font-size: 13px;
        }

        .btn-primary {
            background: #000;
            color: #fff;
            border: 1px solid #000;
            padding: 12px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .btn-primary:hover {
            background: #333;
        }

        /* Drawer Inner Tabs */
        .drawer-tabs {
            display: flex;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 20px;
        }

        .drawer-tab {
            flex: 1;
            padding: 10px;
            background: none;
            border: none;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            text-transform: uppercase;
            color: var(--mid-gray);
            border-bottom: 2px solid transparent !important;
        }

        .drawer-tab.active {
            color: #000;
            border-bottom: 2px solid #000 !important;
        }

        /* AI Options Cards in Drawer */
        .ai-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .ai-item-card {
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 8px;
            background: #fff;
            position: relative;
        }

        .ai-item-img {
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
            background: var(--subtle-gray);
            margin-bottom: 8px;
        }

        .ai-item-title {
            font-size: 11px;
            font-weight: 600;
        }

        .ai-item-brand {
            font-size: 10px;
            color: var(--mid-gray);
        }

        .ai-item-price {
            font-size: 11px;
            font-weight: 700;
            margin-top: 4px;
        }

        .ai-action-btn {
            background: #000;
            color: #fff;
            border: none;
            padding: 6px;
            font-size: 10px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
            text-transform: uppercase;
        }

        /* Outfit Modeler Layout */
        .modeler-container {
            display: grid;
            grid-template-columns: 1fr 340px;
            gap: 32px;
            height: calc(100vh - 180px);
        }

        .mannequin-stage {
            border: 1px solid var(--border-color);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            background: #fff;
            overflow: hidden;
        }

        .silhouette-svg {
            height: 80%;
            max-height: 520px;
            fill: #111;
            opacity: 0.85;
        }

        /* Fitting Slot Dropzones */
        .slot-zone {
            position: absolute;
            border: 1px dashed var(--border-color);
            background: rgba(255, 255, 255, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 6px;
            min-width: 110px;
            min-height: 110px;
            z-index: 10;
        }

        .slot-zone.drag-over {
            border-style: solid;
            background: #f0f0f0;
        }

        .slot-zone-head { top: 8%; left: 18%; }
        .slot-zone-top { top: 28%; left: 18%; }
        .slot-zone-bottom { top: 52%; left: 18%; }
        .slot-zone-shoes { top: 76%; left: 18%; }
        .slot-zone-accessory { top: 38%; right: 18%; }

        .slot-label {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--mid-gray);
            margin-bottom: 4px;
        }

        .slot-card {
            width: 90px;
            height: 90px;
            border: 1px solid var(--border-color);
            background: #fff;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .slot-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .slot-card-remove {
            position: absolute;
            top: -6px;
            right: -6px;
            background: #000;
            color: #fff;
            width: 16px;
            height: 16px;
            border: none;
            font-size: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .slot-card-add-wl {
            position: absolute;
            bottom: 2px;
            left: 2px;
            right: 2px;
            background: rgba(0,0,0,0.85);
            color: #fff;
            border: none;
            font-size: 9px;
            padding: 2px;
            cursor: pointer;
            text-transform: uppercase;
            font-weight: 600;
        }

        /* Sidebar in Modeler */
        .modeler-sidebar {
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            background: #fff;
        }

        .sidebar-header {
            padding: 16px;
            border-bottom: 1px solid var(--border-color);
            background: #fafafa;
        }

        .sidebar-title {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sidebar-controls {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .search-box-wrap {
            display: flex;
            gap: 4px;
        }

        .sidebar-items-grid {
            padding: 16px;
            overflow-y: auto;
            flex: 1;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            align-content: start;
        }

        .sidebar-item {
            border: 1px solid var(--border-color);
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            background: #fff;
            cursor: grab;
            position: relative;
        }

        .sidebar-item img {
            width: 100%;
            height: 70%;
            object-fit: cover;
            background: var(--subtle-gray);
        }

        .sidebar-item-info {
            padding: 4px 6px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            flex: 1;
        }

        .sidebar-item-name {
            font-size: 10px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .sidebar-item-price {
            font-size: 10px;
            color: var(--dark-gray);
        }

        /* Budget Counter */
        .total-counter {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: #fff;
            border: 1px solid var(--border-color);
            padding: 12px 16px;
            font-size: 13px;
            font-weight: 700;
            z-index: 10;
        }

        .btn-clear-search {
            background: #000;
            color: #fff;
            border: none;
            font-size: 10px;
            padding: 4px 8px;
            cursor: pointer;
            text-transform: uppercase;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="user-title">hi elden</div>
        <nav class="nav-tabs">
            <button class="nav-btn active" id="tab-wishlist" onclick="switchView('wishlist')">WISHLIST</button>
            <button class="nav-btn" id="tab-modeler" onclick="switchView('modeler')">OUTFIT MODELER</button>
            <button class="nav-btn" id="tab-graveyard" onclick="switchView('graveyard')">GRAVEYARD</button>
        </nav>
    </header>

    <!-- Wishlist Controls -->
    <div class="controls-bar" id="wishlist-controls">
        <div class="filters-group">
            <label style="font-size: 12px; font-weight: 600;">FILTER BY:</label>
            
            <select id="filter-category" onchange="renderWishlist()">
                <option value="ALL">ALL CATEGORIES</option>
                <option value="Tops">TOPS</option>
                <option value="Bottoms">BOTTOMS</option>
                <option value="Shoes">SHOES</option>
                <option value="Outerwear">OUTERWEAR</option>
                <option value="Accessories">ACCESSORIES</option>
            </select>

            <select id="filter-color" onchange="renderWishlist()">
                <option value="ALL">ALL COLORS</option>
                <option value="Pink">PINK</option>
                <option value="Black">BLACK</option>
                <option value="White">WHITE</option>
                <option value="Brown">BROWN</option>
                <option value="Blue">BLUE</option>
            </select>

            <select id="filter-sort" onchange="renderWishlist()">
                <option value="LATEST">SORT: LATEST ADDED</option>
                <option value="PRICE_LOW">SORT: PRICE LOW TO HIGH</option>
                <option value="PRICE_HIGH">SORT: PRICE HIGH TO LOW</option>
            </select>
        </div>
    </div>

    <!-- Main View Content -->
    <main>
        <!-- WISHLIST VIEW -->
        <div id="view-wishlist">
            <div class="wishlist-grid" id="grid-wishlist">
                <!-- Add Card Trigger -->
                <div class="card card-add-trigger" onclick="openAddDrawer()">
                    +
                </div>
                <!-- Dynamic cards render here -->
            </div>
        </div>

        <!-- GRAVEYARD VIEW -->
        <div id="view-graveyard" class="hidden">
            <div class="wishlist-grid" id="grid-graveyard">
                <!-- Deleted items render here -->
            </div>
        </div>

        <!-- OUTFIT MODELER VIEW -->
        <div id="view-modeler" class="hidden">
            <div class="modeler-container">
                <!-- Mannequin Fitting Area -->
                <div class="mannequin-stage">
                    <div class="total-counter" id="outfit-total">OUTFIT TOTAL: $0</div>

                    <!-- Clean Androgynous Silhouette -->
                    <svg class="silhouette-svg" viewBox="0 0 100 220">
                        <!-- Head -->
                        <circle cx="50" cy="22" r="11" />
                        <!-- Neck -->
                        <rect x="47" y="33" width="6" height="8" />
                        <!-- Torso/Shoulders -->
                        <path d="M 28 42 L 72 42 L 66 110 L 34 110 Z" />
                        <!-- Arms -->
                        <path d="M 27 43 L 18 105 L 23 107 L 31 50 Z" />
                        <!-- Left Arm -->
                        <path d="M 73 43 L 82 105 L 77 107 L 69 50 Z" />
                        <!-- Right Arm -->
                        <!-- Legs -->
                        <rect x="36" y="112" width="11" height="85" />
                        <rect x="53" y="112" width="11" height="85" />
                        <!-- Feet -->
                        <path d="M 33 197 L 47 197 L 47 203 L 31 203 Z" />
                        <path d="M 53 197 L 67 197 L 69 203 L 53 203 Z" />
                    </svg>

                    <!-- Slot Dropzones -->
                    <div class="slot-zone slot-zone-head" data-slot="Head" ondragover="handleDragOver(event)" ondragleave="handleDragLeave(event)" ondrop="handleDrop(event, 'Head')">
                        <span class="slot-label">HEAD</span>
                        <div id="slot-content-Head"></div>
                    </div>

                    <div class="slot-zone slot-zone-top" data-slot="Tops" ondragover="handleDragOver(event)" ondragleave="handleDragLeave(event)" ondrop="handleDrop(event, 'Tops')">
                        <span class="slot-label">TOPS / OUTER</span>
                        <div id="slot-content-Tops"></div>
                    </div>

                    <div class="slot-zone slot-zone-bottom" data-slot="Bottoms" ondragover="handleDragOver(event)" ondragleave="handleDragLeave(event)" ondrop="handleDrop(event, 'Bottoms')">
                        <span class="slot-label">BOTTOMS</span>
                        <div id="slot-content-Bottoms"></div>
                    </div>

                    <div class="slot-zone slot-zone-shoes" data-slot="Shoes" ondragover="handleDragOver(event)" ondragleave="handleDragLeave(event)" ondrop="handleDrop(event, 'Shoes')">
                        <span class="slot-label">SHOES</span>
                        <div id="slot-content-Shoes"></div>
                    </div>

                    <div class="slot-zone slot-zone-accessory" data-slot="Accessories" ondragover="handleDragOver(event)" ondragleave="handleDragLeave(event)" ondrop="handleDrop(event, 'Accessories')">
                        <span class="slot-label">ACCESSORIES</span>
                        <div id="slot-content-Accessories"></div>
                    </div>
                </div>

                <!-- Modeler Sidebar -->
                <div class="modeler-sidebar">
                    <div class="sidebar-header">
                        <div class="sidebar-title">
                            <span id="sidebar-mode-label">WISHLIST ITEMS</span>
                            <button id="btn-clear-search" class="btn-clear-search hidden" onclick="clearModelerSearch()">SHOW WISHLIST</button>
                        </div>
                        <div class="sidebar-controls">
                            <select id="modeler-filter-type" onchange="renderModelerSidebar()">
                                <option value="ALL">ALL CLOTHING TYPES</option>
                                <option value="Tops">TOPS</option>
                                <option value="Bottoms">BOTTOMS</option>
                                <option value="Shoes">SHOES</option>
                                <option value="Outerwear">OUTERWEAR</option>
                                <option value="Accessories">ACCESSORIES</option>
                            </select>
                            
                            <div class="search-box-wrap">
                                <input type="text" id="modeler-search-input" placeholder="Search new items..." style="flex:1;" onkeydown="if(event.key==='Enter') executeModelerSearch()">
                                <button class="btn-primary" style="width: auto; padding: 0 12px;" onclick="executeModelerSearch()">AI SEARCH</button>
                            </div>
                        </div>
                    </div>

                    <div class="sidebar-items-grid" id="modeler-sidebar-grid">
                        <!-- Items rendered here -->
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- DRAWER OVERLAY -->
    <div class="drawer-overlay" id="drawer-overlay" onclick="closeAllDrawers()"></div>

    <!-- ADD ITEM DRAWER -->
    <div class="drawer" id="add-drawer">
        <div class="drawer-header">
            <h3 style="font-size: 14px; text-transform: uppercase;">ADD ITEM</h3>
            <button class="close-btn" onclick="closeAllDrawers()">✕</button>
        </div>

        <div class="form-group">
            <label>PASTE SPECIFIC ITEM LINK</label>
            <input type="text" id="add-link-input" placeholder="https://store.com/item-url...">
            <button class="btn-primary" style="margin-top: 8px;" onclick="addSpecificItem()">ADD LINK ITEM</button>
        </div>

        <div style="text-align: center; font-size: 11px; color: var(--mid-gray); margin: 20px 0;">— OR —</div>

        <div class="form-group">
            <label>GENERAL ITEM IDEA</label>
            <textarea id="add-general-input" rows="3" placeholder="describe what you want (e.g. pink shorts, leather trench coat)..."></textarea>
            <button class="btn-primary" style="margin-top: 8px;" onclick="addGeneralItem()">CREATE GENERAL IDEA</button>
        </div>
    </div>

    <!-- GENERAL ITEM AI OPTIONS DRAWER -->
    <div class="drawer" id="ai-drawer">
        <div class="drawer-header">
            <h3 style="font-size: 14px; text-transform: uppercase;" id="ai-drawer-title">PINK SHORTS</h3>
            <button class="close-btn" onclick="closeAllDrawers()">✕</button>
        </div>

        <div class="drawer-tabs">
            <button class="drawer-tab active" id="tab-ai-search" onclick="switchDrawerTab('search')">AI DISCOVER</button>
            <button class="drawer-tab" id="tab-ai-saved" onclick="switchDrawerTab('saved')">SAVED OPTIONS (<span id="saved-count">0</span>)</button>
        </div>

        <!-- SEARCH TAB -->
        <div id="drawer-view-search">
            <div style="display: flex; gap: 8px; margin-bottom: 16px;">
                <select id="ai-filter-price" style="flex: 1;" onchange="renderAiDiscover()">
                    <option value="ALL">ANY PRICE</option>
                    <option value="UNDER_50">UNDER $50</option>
                    <option value="50_150">$50 - $150</option>
                    <option value="OVER_150">OVER $150</option>
                </select>
                <select id="ai-filter-size" style="flex: 1;">
                    <option value="ALL">ALL SIZES</option>
                    <option value="S">SMALL (S)</option>
                    <option value="M">MEDIUM (M)</option>
                    <option value="L">LARGE (L)</option>
                </select>
            </div>

            <div class="ai-grid" id="ai-discover-grid">
                <!-- AI results rendered here -->
            </div>
        </div>

        <!-- SAVED TAB -->
        <div id="drawer-view-saved" class="hidden">
            <div class="ai-grid" id="ai-saved-grid">
                <!-- Saved items rendered here -->
            </div>
        </div>
    </div>

                ]
            }
        ];

        let graveyardData = [];

            Accessories: null
        };

        let modelerSearchResults = null; // null means showing wishlist

        // Mock AI Database Pool
        const mockAiDatabase = [
            { id: 'ai-1', title: 'Zara High-Waist Pink Shorts', brand: 'Zara', price: 45, category: 'Bottoms', color: 'Pink', image: 'https://images.unsplash.com/photo-1591195853828-11db59a44f6b?w=400&auto=format&fit=crop&q=60' },
            { id: 'ai-2', title: 'Jacquemus Pink Tailored Shorts', brand: 'Jacquemus', price: 280, category: 'Bottoms', color: 'Pink', image: 'https://images.unsplash.com/photo-1591195853828-11db59a44f6b?w=400&auto=format&fit=crop&q=60' },
            { id: 'ai-3', title: 'Acne Studios Pink Cotton Shorts', brand: 'Acne Studios', price: 190, category: 'Bottoms', color: 'Pink', image: 'https://images.unsplash.com/photo-1591195853828-11db59a44f6b?w=400&auto=format&fit=crop&q=60' },
            { id: 'ai-4', title: 'Ganni Pleated Pink Shorts', brand: 'Ganni', price: 120, category: 'Bottoms', color: 'Pink', image: 'https://images.unsplash.com/photo-1591195853828-11db59a44f6b?w=400&auto=format&fit=crop&q=60' },
            { id: 'ai-5', title: 'Black Oversized Leather Jacket', brand: 'Acne Studios', price: 650, category: 'Outerwear', color: 'Black', image: 'https://images.unsplash.com/photo-1551028719-00167b16eac5?w=400&auto=format&fit=crop&q=60' },
            { id: 'ai-6', title: 'White Chunky Sneakers', brand: 'Balenciaga', price: 890, category: 'Shoes', color: 'White', image: 'https://images.unsplash.com/photo-1595950653106-6c9ebd614d3a?w=400&auto=format&fit=crop&q=60' },
            { id: 'ai-7', title: 'Classic Leather Tote', brand: 'Saint Laurent', price: 1250, category: 'Accessories', color: 'Black', image: 'https://images.unsplash.com/photo-1584917865442-de89df76afd3?w=400&auto=format&fit=crop&q=60' }
        ];

        // Initialization
        window.onload = () => {
            renderWishlist();
            renderModelerSidebar();
        };

        // Navigation
        function switchView(viewName) {
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`tab-${viewName}`).classList.add('active');

            document.getElementById('view-wishlist').classList.add('hidden');
            document.getElementById('view-graveyard').classList.add('hidden');
            document.getElementById('view-modeler').classList.add('hidden');

            document.getElementById('wishlist-controls').style.display = viewName === 'wishlist' ? 'flex' : 'none';

            if (viewName === 'wishlist') {
                document.getElementById('view-wishlist').classList.remove('hidden');
                renderWishlist();
            } else if (viewName === 'graveyard') {
                document.getElementById('view-graveyard').classList.remove('hidden');
                renderGraveyard();
            } else if (viewName === 'modeler') {
                document.getElementById('view-modeler').classList.remove('hidden');
                renderModelerSidebar();
            }
        }

        // Render Wishlist Grid
        function renderWishlist() {
            const grid = document.getElementById('grid-wishlist');
            grid.innerHTML = `<div class="card card-add-trigger" onclick="openAddDrawer()">+</div>`;

            const catFilter = document.getElementById('filter-category').value;
            const colorFilter = document.getElementById('filter-color').value;
            const sortFilter = document.getElementById('filter-sort').value;

            let items = wishlistData.filter(item => {
                if (catFilter !== 'ALL' && item.category !== catFilter) return false;
                if (colorFilter !== 'ALL' && item.color !== colorFilter) return false;
                return true;
            });

            if (sortFilter === 'PRICE_LOW') {
                items.sort((a,b) => (a.price || 0) - (b.price || 0));
            } else if (sortFilter === 'PRICE_HIGH') {
                items.sort((a,b) => (b.price || 0) - (a.price || 0));
            } else {
                items.sort((a,b) => b.dateAdded - a.dateAdded);
            }

            items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';

                if (item.type === 'specific') {
                    card.innerHTML = `
                        <button class="trash-btn" onclick="moveToGraveyard(event, '${item.id}')">✕</button>
                        <div class="card-img-container">
                            <img src="${item.image}" class="card-img" alt="${item.title}">
                        </div>
                        <div class="card-details">
                            <div class="card-title">${item.title}</div>
                            <div class="card-price">$${item.price}</div>
                        </div>
                    `;
                } else {
                    // General Idea rotating concept card
                    card.onclick = () => openAiDrawer(item.id);
                    card.innerHTML = `
                        <button class="trash-btn" onclick="moveToGraveyard(event, '${item.id}')">✕</button>
                        <span class="card-badge">GENERAL IDEA</span>
                        <div class="card-img-container">
                            <div style="font-size: 12px; text-transform: uppercase; text-align: center; padding: 12px; font-weight: 600;">
                                ${item.title}<br>
                                <span style="font-size: 10px; color: var(--mid-gray); font-weight: 400; text-transform: none; margin-top: 6px; display:block;">Click for AI options (${item.savedOptions ? item.savedOptions.length : 0} saved)</span>
                            </div>
                        </div>
                        <div class="card-details">
                            <div class="card-title">${item.title}</div>
                            <div class="card-price" style="font-size:10px; color: var(--mid-gray);">EXPLORE OPTIONS →</div>
                        </div>
                    `;
                }
                grid.appendChild(card);
            });
        }

        // Render Graveyard Tab
        function renderGraveyard() {
            const grid = document.getElementById('grid-graveyard');
            grid.innerHTML = '';

            if (graveyardData.length === 0) {
                grid.innerHTML = `<div style="grid-column: 1/-1; color: var(--mid-gray); font-size: 13px;">Graveyard is empty.</div>`;
                return;
            }

            graveyardData.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="card-img-container">
                        ${item.image ? `<img src="${item.image}" class="card-img">` : `<div style="font-size:11px;">${item.title}</div>`}
                    </div>
                    <div class="card-details">
                        <div class="card-title">${item.title}</div>
                        <button class="btn-primary" style="padding: 4px; font-size: 9px; margin-top: 4px;" onclick="restoreFromGraveyard('${item.id}')">RESTORE</button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // Drawers Management
        function openAddDrawer() {
            document.getElementById('drawer-overlay').classList.add('open');
            document.getElementById('add-drawer').classList.add('open');
        }

        function closeAllDrawers() {
            document.getElementById('drawer-overlay').classList.remove('open');
            document.getElementById('add-drawer').classList.remove('open');
            document.getElementById('ai-drawer').classList.remove('open');
        }

        // Add Items
        function addSpecificItem() {
            const link = document.getElementById('add-link-input').value.trim();
            if (!link) return;

            const newItem = {
                id: Date.now().toString(),
                type: 'specific',
                title: 'Imported Item ' + Math.floor(Math.random()*100),
                price: Math.floor(Math.random() * 150) + 25,
                category: 'Tops',
                color: 'Black',
                image: 'https://images.unsplash.com/photo-1521572267360-ee0c2909d518?w=400&auto=format&fit=crop&q=60',
                dateAdded: Date.now()
            };

            wishlistData.push(newItem);
            document.getElementById('add-link-input').value = '';
            closeAllDrawers();
            renderWishlist();
        }

        function addGeneralItem() {
            const prompt = document.getElementById('add-general-input').value.trim();
            if (!prompt) return;

            const newItem = {
                id: Date.now().toString(),
                type: 'general',
                title: prompt,
                category: 'Bottoms',
                color: 'Pink',
                dateAdded: Date.now(),
                savedOptions: []
            };

            wishlistData.push(newItem);
            document.getElementById('add-general-input').value = '';
            closeAllDrawers();
            renderWishlist();
        }

        // Graveyard Actions
        function moveToGraveyard(event, itemId) {
            event.stopPropagation();
            const idx = wishlistData.findIndex(i => i.id === itemId);
            if (idx !== -1) {
                graveyardData.push(wishlistData[idx]);
                wishlistData.splice(idx, 1);
                renderWishlist();
            }
        }

        function restoreFromGraveyard(itemId) {
            const idx = graveyardData.findIndex(i => i.id === itemId);
            if (idx !== -1) {
                wishlistData.push(graveyardData[idx]);
                graveyardData.splice(idx, 1);
                renderGraveyard();
            }
        }

        // General Item AI Options Drawer
        function openAiDrawer(itemId) {
            activeGeneralItemId = itemId;
            const item = wishlistData.find(i => i.id === itemId);
            if (!item) return;

            document.getElementById('ai-drawer-title').innerText = item.title;
            document.getElementById('drawer-overlay').classList.add('open');
            document.getElementById('ai-drawer').classList.add('open');

            switchDrawerTab('search');
            renderAiDiscover();
            updateSavedCount();
        }

        function switchDrawerTab(tab) {
            document.getElementById('tab-ai-search').classList.toggle('active', tab === 'search');
            document.getElementById('tab-ai-saved').classList.toggle('active', tab === 'saved');

            document.getElementById('drawer-view-search').classList.toggle('hidden', tab !== 'search');
            document.getElementById('drawer-view-saved').classList.toggle('hidden', tab !== 'saved');

            if (tab === 'saved') renderAiSaved();
        }

        function renderAiDiscover() {
            const grid = document.getElementById('ai-discover-grid');
            grid.innerHTML = '';

            const priceFilter = document.getElementById('ai-filter-price').value;

            let options = mockAiDatabase.filter(item => {
                if (priceFilter === 'UNDER_50' && item.price >= 50) return false;
                if (priceFilter === '50_150' && (item.price < 50 || item.price > 150)) return false;
                if (priceFilter === 'OVER_150' && item.price <= 150) return false;
                return true;
            });

            options.forEach(opt => {
                const card = document.createElement('div');
                card.className = 'ai-item-card';
                card.innerHTML = `
                    <img src="${opt.image}" class="ai-item-img">
                    <div class="ai-item-title">${opt.title}</div>
                    <div class="ai-item-brand">${opt.brand}</div>
                    <div class="ai-item-price">$${opt.price}</div>
                    <button class="ai-action-btn" onclick="saveAiOptionToGeneral('${opt.id}')">+ SAVE OPTION</button>
                `;
                grid.appendChild(card);
            });
        }

        function saveAiOptionToGeneral(optId) {
            const genItem = wishlistData.find(i => i.id === activeGeneralItemId);
            const opt = mockAiDatabase.find(o => o.id === optId);

            if (genItem && opt) {
                if (!genItem.savedOptions) genItem.savedOptions = [];
                if (!genItem.savedOptions.some(o => o.id === opt.id)) {
                    genItem.savedOptions.push({...opt});
                    updateSavedCount();
                }
            }
        }

        function updateSavedCount() {
            const genItem = wishlistData.find(i => i.id === activeGeneralItemId);
            const count = genItem && genItem.savedOptions ? genItem.savedOptions.length : 0;
            document.getElementById('saved-count').innerText = count;
        }

        function renderAiSaved() {
            const grid = document.getElementById('ai-saved-grid');
            grid.innerHTML = '';

            const genItem = wishlistData.find(i => i.id === activeGeneralItemId);
            if (!genItem || !genItem.savedOptions || genItem.savedOptions.length === 0) {
                grid.innerHTML = `<div style="grid-column: 1/-1; font-size:12px; color: var(--mid-gray);">No saved options yet. Click "+" in Discover tab to save options.</div>`;
                return;
            }

            genItem.savedOptions.forEach((opt, idx) => {
                const card = document.createElement('div');
                card.className = 'ai-item-card';
                card.innerHTML = `
                    <img src="${opt.image}" class="ai-item-img">
                    <div class="ai-item-title">${opt.title}</div>
                    <div class="ai-item-price">$${opt.price}</div>
                    <button class="ai-action-btn" onclick="transferSavedToMainWishlist(${idx})">ADD TO MAIN WISHLIST</button>
                `;
                grid.appendChild(card);
            });
        }

        function transferSavedToMainWishlist(savedIndex) {
            const genItem = wishlistData.find(i => i.id === activeGeneralItemId);
            if (!genItem || !genItem.savedOptions) return;

            const savedOpt = genItem.savedOptions[savedIndex];

            // Add as specific item to main wishlist
            wishlistData.push({
                id: Date.now().toString(),
                type: 'specific',
                title: savedOpt.title,
                price: savedOpt.price,
                category: savedOpt.category || 'Bottoms',
                color: savedOpt.color || 'Pink',
                image: savedOpt.image,
                dateAdded: Date.now()
            });

            // Remove from general item saved options
            genItem.savedOptions.splice(savedIndex, 1);

            updateSavedCount();
            renderAiSaved();
            renderWishlist();
        }

        // --- OUTFIT MODELER LOGIC ---

        function renderModelerSidebar() {
            const grid = document.getElementById('modeler-sidebar-grid');
            grid.innerHTML = '';

            const categoryFilter = document.getElementById('modeler-filter-type').value;

            let sourceList = [];

            if (modelerSearchResults !== null) {
                // Showing Search Results
                document.getElementById('sidebar-mode-label').innerText = 'AI SEARCH RESULTS';
                document.getElementById('btn-clear-search').classList.remove('hidden');
                sourceList = modelerSearchResults;
            } else {
                // Default: Showing Wishlist
                document.getElementById('sidebar-mode-label').innerText = 'WISHLIST ITEMS';
                document.getElementById('btn-clear-search').classList.add('hidden');
                
                // Only specific items or saved options from wishlist
                wishlistData.forEach(item => {
                    if (item.type === 'specific') {
                        sourceList.push(item);
                    } else if (item.savedOptions) {
                        item.savedOptions.forEach(opt => sourceList.push(opt));
                    }
                });
            }

            // Apply clothing category filter
            if (categoryFilter !== 'ALL') {
                sourceList = sourceList.filter(i => (i.category || 'Tops') === categoryFilter);
            }

            if (sourceList.length === 0) {
                grid.innerHTML = `<div style="grid-column: 1/-1; font-size:11px; color: var(--mid-gray);">No items available.</div>`;
                return;
            }

            sourceList.forEach(item => {
                const card = document.createElement('div');
                card.className = 'sidebar-item';
                card.draggable = true;

                card.ondragstart = (e) => {
                    e.dataTransfer.setData('text/plain', JSON.stringify(item));
                };

                card.innerHTML = `
                    <img src="${item.image}">
                    <div class="sidebar-item-info">
                        <div class="sidebar-item-name">${item.title}</div>
                        <div class="sidebar-item-price">$${item.price || 0}</div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function executeModelerSearch() {
            const query = document.getElementById('modeler-search-input').value.trim().toLowerCase();
            if (!query) return;

            // Search mock database
            modelerSearchResults = mockAiDatabase.filter(item => 
                item.title.toLowerCase().includes(query) || 
                item.category.toLowerCase().includes(query) ||
                item.color.toLowerCase().includes(query)
            );

            // If no match found, show generic generated suggestions
            if (modelerSearchResults.length === 0) {
                modelerSearchResults = [
                    { id: 'sr-1', title: query + ' Style Option A', price: 65, category: 'Tops', image: 'https://images.unsplash.com/photo-1521572267360-ee0c2909d518?w=400&auto=format&fit=crop&q=60' },
                    { id: 'sr-2', title: query + ' Style Option B', price: 110, category: 'Bottoms', image: 'https://images.unsplash.com/photo-1591195853828-11db59a44f6b?w=400&auto=format&fit=crop&q=60' }
                ];
            }

            renderModelerSidebar();
        }

        function clearModelerSearch() {
            modelerSearchResults = null;
            document.getElementById('modeler-search-input').value = '';
            renderModelerSidebar();
        }

        // Drag and Drop onto Mannequin
        function handleDragOver(e) {
            e.preventDefault();
            e.currentTarget.classList.add('drag-over');
        }

        function handleDragLeave(e) {
            e.currentTarget.classList.remove('drag-over');
        }

        function handleDrop(e, slotName) {
            e.preventDefault();
            e.currentTarget.classList.remove('drag-over');

            const itemDataStr = e.dataTransfer.getData('text/plain');
            if (!itemDataStr) return;

            const item = JSON.parse(itemDataStr);
            outfitSlots[slotName] = item;

            renderSlots();
        }

        function renderSlots() {
            let total = 0;

            Object.keys(outfitSlots).forEach(slotName => {
                const container = document.getElementById(`slot-content-${slotName}`);
                const item = outfitSlots[slotName];

                if (!item) {
                    container.innerHTML = '';
                    return;
                }

                total += (item.price || 0);

                // Check if this item is already in main wishlist
                const inWishlist = wishlistData.some(w => w.id === item.id || w.title === item.title);

                const slotCard = document.createElement('div');
                slotCard.className = 'slot-card';
                slotCard.innerHTML = `
                    <button class="slot-card-remove" onclick="removeSlotItem('${slotName}')">✕</button>
                    <img src="${item.image}">
                    ${!inWishlist ? `<button class="slot-card-add-wl" onclick="addSlotItemToWishlist('${slotName}')">+ WISHLIST</button>` : ''}
                `;

                container.innerHTML = '';
                container.appendChild(slotCard);
            });

            document.getElementById('outfit-total').innerText = `OUTFIT TOTAL: $${total}`;
        }

        function removeSlotItem(slotName) {
            outfitSlots[slotName] = null;
            renderSlots();
        }

        function addSlotItemToWishlist(slotName) {
            const item = outfitSlots[slotName];
            if (!item) return;

            wishlistData.push({
                id: Date.now().toString(),
                type: 'specific',
                title: item.title,
                price: item.price || 0,
                category: item.category || slotName,
                color: item.color || 'Black',
                image: item.image,
                dateAdded: Date.now()
            });

            renderSlots();
            renderWishlist();
        }
    </script>
</body>
